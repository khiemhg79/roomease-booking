spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  application:
    name: roomease-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    clean-disabled: true

  jackson:
    time-zone: Asia/Ho_Chi_Minh

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}

  google:
    client-id: ${GOOGLE_CLIENT_ID:}

  sepay:
    webhook-secret: ${SEPAY_WEBHOOK_SECRET:whsec_v7PPCwn48lTBf0OJilDpkwEkN6fpaBR3}
    bank-code: ${SEPAY_BANK_CODE:TPBank}
    account-number: "${SEPAY_ACCOUNT_NUMBER:00004005537}"
    account-name: ${SEPAY_ACCOUNT_NAME:HOANG GIA KHIEM}
    qr-template: ${SEPAY_QR_TEMPLATE:compact}
    store-name: ${SEPAY_STORE_NAME:RoomEase}
    memo-prefix: ${SEPAY_MEMO_PREFIX:}
    max-timestamp-drift-seconds: ${SEPAY_MAX_TIMESTAMP_DRIFT_SECONDS:300}

logging:
  level:
    com.roomease: DEBUG
    com.roomease.payment: DEBUG