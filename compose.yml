services:
  backend:
    build: ./be
    env_file:
      - ./be/.env
    ports:
      - "8080:8080"

  customer:
    build:
      context: ./fe/customer
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    depends_on:
      - backend
    ports:
      - "5173:80"

  manager:
    build:
      context: ./fe/manager
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    depends_on:
      - backend
    ports:
      - "5174:80"

  admin:
    build:
      context: ./fe/admin
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    depends_on:
      - backend
    ports:
      - "5175:80"
